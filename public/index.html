<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encurtador de Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 8px; }
    input[type="url"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="url"]:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #22c55e;
      border-radius: 8px;
    }
    .result a {
      color: #22c55e;
      font-size: 18px;
      word-break: break-all;
      text-decoration: none;
    }
    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      padding: 8px;
      font-size: 14px;
    }
    .copy-btn:hover { background: #16a34a; }
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      border-radius: 8px;
      font-size: 14px;
    }
    .admin-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
    }
    .admin-link:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 Encurtador de Links</h1>
    <p class="sub">Cole seu link e gere um link curto para enviar por SMS</p>
    <form id="form">
      <label for="url">Link original</label>
      <input type="url" id="url" placeholder="https://seusite.com/pagina-longa" required>
      <button type="submit">Encurtar link</button>
    </form>
    <div class="error" id="error"></div>
    <div class="result" id="result">
      <p style="color:#94a3b8;font-size:13px;margin-bottom:6px;">Seu link curto:</p>
      <a id="shortLink" href="#" target="_blank"></a>
      <button class="copy-btn" onclick="copyLink()">📋 Copiar link</button>
    </div>
    <a class="admin-link" href="/admin">Painel de gestão →</a>
  </div>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('error');
    const shortLink = document.getElementById('shortLink');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      result.style.display = 'none';

      const url = document.getElementById('url').value;

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error;
          errorBox.style.display = 'block';
          return;
        }

        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        result.style.display = 'block';
      } catch {
        errorBox.textContent = 'Erro ao conectar. Tente novamente.';
        errorBox.style.display = 'block';
      }
    });

    function copyLink() {
      navigator.clipboard.writeText(shortLink.textContent);
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✅ Copiado!';
      setTimeout(() => (btn.textContent = '📋 Copiar link'), 2000);
    }
  </script>
</body>
</html>
